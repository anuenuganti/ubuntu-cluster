apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
#custom name that you have given to the ingress controller
  name: linkding
spec:
  ingressClassName: traefik
  rules:
    - host: lds.anuenuganti.net
      http:
        paths:
          - backend:
              service:
                name: linkding
                port:
                  number: 9090
            path: /
            pathType: Prefix
