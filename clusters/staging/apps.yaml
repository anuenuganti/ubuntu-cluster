apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m0s
  retryInterval: 1m
  path: ./apps/staging
  prune: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/staging  #added by Anu based on Mischa's file
  prune: true           #added by Anu based on Mischa's file
  decryption:           #added by Anu for sops encryption/decryption
    provider: sops
    secretRef:
      name: sops-age
